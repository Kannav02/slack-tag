# One fixed service per mapped channel. Run deploy/prepare-project.sh on each project first.
# Project containers run under gVisor. Set SLACK_TAG_RUNTIME=runc only where gVisor cannot be installed.
x-channel: &channel
  image: slack-tag-opencode:2.2.7
  runtime: ${SLACK_TAG_RUNTIME:-runsc}
  restart: unless-stopped
  # start-server drops to node (uid 1000); agent-shell drops agent shells to agent (uid 1001).
  user: "0:0"
  init: true
  read_only: true
  cap_drop: [ALL]
  cap_add: [SETUID, SETGID]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 2g
  pids_limit: 512
  # OpenCode needs a Go credential to route; the real key lives only in key-proxy.
  environment: { OPENCODE_API_KEY: unused }
  depends_on: [key-proxy]
  tmpfs: [/tmp]

services:
  # Adds the OpenCode Go key to model requests. Not published on the host.
  key-proxy:
    image: slack-tag-opencode:2.2.7
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    env_file: ${PROXY_ENV_FILE:-/etc/slack-tag/proxy.env}
    command: ["node", "--experimental-strip-types", "/opt/slack-tag/proxy/key-proxy.ts"]
    # Joins every project network at a fixed address; projects cannot reach each other.
    networks:
      alpha: { ipv4_address: 172.30.1.2 }
      beta: { ipv4_address: 172.30.2.2 }

  alpha:
    <<: *channel
    build: { context: .., dockerfile: deploy/Dockerfile }
    # Holds this server's own OPENCODE_SERVER_PASSWORD.
    env_file: ${ALPHA_ENV_FILE:-/etc/slack-tag/alpha.env}
    networks: [alpha]
    # gVisor cannot use Docker's built-in DNS, so key-proxy is found by its fixed address.
    extra_hosts: ["key-proxy:172.30.1.2"]
    ports: ["127.0.0.1:${ALPHA_PORT:-4101}:4096"]
    volumes:
      - ${ALPHA_PROJECT:?set ALPHA_PROJECT}:/project
      - alpha-data:/data
      - ./resolv.conf:/etc/resolv.conf:ro
      - ${ALPHA_PROJECT}/.opencode:/project/.opencode:ro
      - ${ALPHA_PROJECT}/opencode.json:/project/opencode.json:ro
      - ${ALPHA_PROJECT}/opencode.jsonc:/project/opencode.jsonc:ro
      # .git is its own mount point (read-write) so the agent cannot rename or delete it; the kernel
      # refuses that with EBUSY, which would otherwise move the read-only mounts below aside and let
      # a fresh writable .git with agent-chosen config/hooks/commondir run under the server (#60).
      - ${ALPHA_PROJECT}/.git:/project/.git
      - ${ALPHA_PROJECT}/.git/hooks:/project/.git/hooks:ro
      - ${ALPHA_PROJECT}/.git/config:/project/.git/config:ro
      - ${ALPHA_PROJECT}/.git/commondir:/project/.git/commondir:ro
      # Slack uploads, written by the bridge. Create it before the first start (docs/deploy.md).
      - ${ALPHA_INBOX:-/var/lib/slack-tag/inbox/alpha}:/inbox:ro

  # Copy this service for each further channel, with its own port, project, env file, network, subnet, and data volume.
  beta:
    <<: *channel
    profiles: [extra]
    env_file: ${BETA_ENV_FILE:-/etc/slack-tag/beta.env}
    networks: [beta]
    extra_hosts: ["key-proxy:172.30.2.2"]
    ports: ["127.0.0.1:${BETA_PORT:-4102}:4096"]
    volumes:
      - ${BETA_PROJECT:-/nonexistent}:/project
      - beta-data:/data
      - ./resolv.conf:/etc/resolv.conf:ro
      - ${BETA_PROJECT:-/nonexistent}/.opencode:/project/.opencode:ro
      - ${BETA_PROJECT:-/nonexistent}/opencode.json:/project/opencode.json:ro
      - ${BETA_PROJECT:-/nonexistent}/opencode.jsonc:/project/opencode.jsonc:ro
      # .git is its own mount point (read-write) so it cannot be renamed or deleted; see alpha (#60).
      - ${BETA_PROJECT:-/nonexistent}/.git:/project/.git
      - ${BETA_PROJECT:-/nonexistent}/.git/hooks:/project/.git/hooks:ro
      - ${BETA_PROJECT:-/nonexistent}/.git/config:/project/.git/config:ro
      - ${BETA_PROJECT:-/nonexistent}/.git/commondir:/project/.git/commondir:ro
      - ${BETA_INBOX:-/var/lib/slack-tag/inbox/beta}:/inbox:ro

volumes:
  alpha-data:
  beta-data:

# Bridge names start with st- so deploy/firewall.sh can block the metadata address and the host for them.
networks:
  alpha:
    driver_opts: { com.docker.network.bridge.name: st-alpha }
    ipam: { config: [{ subnet: 172.30.1.0/24 }] }
  beta:
    driver_opts: { com.docker.network.bridge.name: st-beta }
    ipam: { config: [{ subnet: 172.30.2.0/24 }] }
