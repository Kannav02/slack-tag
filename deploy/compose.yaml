# One fixed service per mapped channel. Run deploy/prepare-project.sh on each project first.
# SLACK_TAG_RUNTIME=runsc when gVisor is installed. Otherwise the default is runc.
x-channel: &channel
  image: slack-tag-opencode:2.0.15
  runtime: ${SLACK_TAG_RUNTIME:-runc}
  restart: unless-stopped
  user: "1000:1000"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 2g
  pids_limit: 512
  env_file: ${OPENCODE_ENV_FILE:-/etc/slack-tag/opencode.env}
  # OpenCode needs a Go credential to route; the real key lives only in key-proxy.
  environment: { OPENCODE_API_KEY: unused }
  depends_on: [key-proxy]
  tmpfs: [/tmp]

services:
  # Adds the OpenCode Go key to model requests. Not published on the host.
  key-proxy:
    image: slack-tag-opencode:2.0.15
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    env_file: ${PROXY_ENV_FILE:-/etc/slack-tag/proxy.env}
    command: ["node", "--experimental-strip-types", "/opt/slack-tag/proxy/key-proxy.ts"]

  alpha:
    <<: *channel
    build: { context: .., dockerfile: deploy/Dockerfile }
    ports: ["127.0.0.1:${ALPHA_PORT:-4101}:4096"]
    volumes:
      - ${ALPHA_PROJECT:?set ALPHA_PROJECT}:/project
      - alpha-data:/data
      - ${ALPHA_PROJECT}/.opencode:/project/.opencode:ro
      - ${ALPHA_PROJECT}/opencode.json:/project/opencode.json:ro
      - ${ALPHA_PROJECT}/opencode.jsonc:/project/opencode.jsonc:ro
      - ${ALPHA_PROJECT}/.git/hooks:/project/.git/hooks:ro
      - ${ALPHA_PROJECT}/.git/config:/project/.git/config:ro

  # Copy this service for each further channel, with its own port, project, and data volume.
  beta:
    <<: *channel
    profiles: [extra]
    ports: ["127.0.0.1:${BETA_PORT:-4102}:4096"]
    volumes:
      - ${BETA_PROJECT:-/nonexistent}:/project
      - beta-data:/data
      - ${BETA_PROJECT:-/nonexistent}/.opencode:/project/.opencode:ro
      - ${BETA_PROJECT:-/nonexistent}/opencode.json:/project/opencode.json:ro
      - ${BETA_PROJECT:-/nonexistent}/opencode.jsonc:/project/opencode.jsonc:ro
      - ${BETA_PROJECT:-/nonexistent}/.git/hooks:/project/.git/hooks:ro
      - ${BETA_PROJECT:-/nonexistent}/.git/config:/project/.git/config:ro

volumes:
  alpha-data:
  beta-data:
